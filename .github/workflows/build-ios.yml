name: build-ios
on: workflow_dispatch
env:
  LLVM_CACHE_KEY: llvm-ios-15.0.7-v1
jobs:
  vcruntime:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          $names = 'concrt140','msvcp140','msvcp140_1','msvcp140_2','msvcp140_atomic_wait','msvcp140_codecvt_ids','vcamp140','vccorlib140','vcomp140','vcruntime140','vcruntime140_1','vcruntime140_threads'
          New-Item -ItemType Directory vcrt | Out-Null
          foreach ($n in $names) {
            $f = "$env:SystemRoot\System32\$n.dll"
            if (Test-Path $f) { Copy-Item $f vcrt } else { Write-Error "missing $f" }
          }
          Get-ChildItem vcrt
      - uses: actions/upload-artifact@v4
        with: { name: vcruntime, path: vcrt }

  # LLVM 15 for iOS takes hours, so it gets its own job (own 6h budget) and a
  # cache. Once cached, this job finishes in seconds on later runs.
  llvm:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - id: llvm
        uses: actions/cache@v4
        with:
          key: ${{ env.LLVM_CACHE_KEY }}
          path: |
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib/*.a
            toolchains/llvm-project/llvm/include
      - if: steps.llvm.outputs.cache-hit != 'true'
        run: STAGES="prereqs llvm-ios" bash scripts/build-all-macos.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: llvm-logs, path: build-logs }

  build:
    needs: vcruntime
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/download-artifact@v4
        with: { name: vcruntime, path: vcrt }
      - uses: actions/cache/restore@v4
        with:
          key: ${{ env.LLVM_CACHE_KEY }}
          path: |
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib/*.a
            toolchains/llvm-project/llvm/include
      - run: chmod +x scripts/build-all-macos.sh build/*/*.sh build/*.sh
      - run: VCRUNTIME_DIR="$PWD/vcrt" REQUIRE_CACHED_LLVM=1 scripts/build-all-macos.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira
          path: |
            build/ipa/Madeira.ipa
            build-logs
