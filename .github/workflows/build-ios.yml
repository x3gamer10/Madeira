name: build-ios
on:
  workflow_dispatch:
    inputs:
      update_base_run:
        description: "Also make an update pack for the IPA built by this run ID (docs/UPDATES.md)"
        required: false
        default: ""
env:
  LLVM_CACHE_KEY: llvm-ios-15.0.7-v1
jobs:
  vcruntime:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          $names = 'concrt140','msvcp140','msvcp140_1','msvcp140_2','msvcp140_atomic_wait','msvcp140_codecvt_ids','vcamp140','vccorlib140','vcomp140','vcruntime140','vcruntime140_1','vcruntime140_threads'
          New-Item -ItemType Directory vcrt | Out-Null
          foreach ($n in $names) {
            $f = "$env:SystemRoot\System32\$n.dll"
            if (Test-Path $f) { Copy-Item $f vcrt } else { Write-Error "missing $f" }
          }
          Get-ChildItem vcrt
      - uses: actions/upload-artifact@v4
        with: { name: vcruntime, path: vcrt }

  # LLVM 15 for iOS takes hours, so it gets its own job (own 6h budget) and a
  # cache. Once cached, this job finishes in seconds on later runs.
  llvm:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - id: llvm
        uses: actions/cache@v4
        with:
          key: ${{ env.LLVM_CACHE_KEY }}
          path: |
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib/*.a
            toolchains/llvm-project/llvm/include
      - if: steps.llvm.outputs.cache-hit != 'true'
        run: STAGES="prereqs llvm-ios" bash tools/build-all-macos.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: llvm-logs, path: build-logs }

  build:
    needs: vcruntime
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/download-artifact@v4
        with: { name: vcruntime, path: vcrt }
      - uses: actions/cache/restore@v4
        with:
          key: ${{ env.LLVM_CACHE_KEY }}
          path: |
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib/*.a
            toolchains/llvm-project/llvm/include
      # The sources use iOS 26 SDK APIs (e.g. rusage_info_v6.ri_page_wait_time_mach), so
      # pick the newest Xcode 26 on the image instead of the default 16.x.
      - run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "no Xcode 26 on this runner image"; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      # The 32-bit (WoW64) Windows farm takes ~an hour to build; reuse it until the
      # wine or DXMT pin (or its build script, or an i386 patch) changes.
      - id: i386key
        run: echo "key=i386-farm-$(git -C wine rev-parse HEAD)-$(git -C dxmt rev-parse HEAD)-${{ hashFiles('build/wine-i386/build.sh', 'patches/wine-i386-*.patch') }}" >> "$GITHUB_OUTPUT"
      - id: i386cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.i386key.outputs.key }}
          path: app/Madeira/i386-windows
      - run: chmod +x tools/*.sh build/*/*.sh build/*.sh
      - run: VCRUNTIME_DIR="$PWD/vcrt" REQUIRE_CACHED_LLVM=1 tools/build-all-macos.sh
      # Saved even if a later stage failed, but only a farm that actually built.
      - if: always() && steps.i386cache.outputs.cache-hit != 'true' && hashFiles('app/Madeira/i386-windows/kernel32.dll') != ''
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.i386key.outputs.key }}
          path: app/Madeira/i386-windows
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira
          path: |
            build/ipa/Madeira.ipa
            build-logs
      # Small on its own so a later run can make an update pack against this build.
      - uses: actions/upload-artifact@v4
        with: { name: pe-manifest, path: build-logs/pe-manifest.txt }
      - if: inputs.update_base_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN: ${{ inputs.update_base_run }}
        run: |
          gh run download "$BASE_RUN" -R "$GITHUB_REPOSITORY" -n pe-manifest -D base-manifest
          bash tools/make-update-pack.sh base-manifest/pe-manifest.txt build/ipa/madeira-update.zip
      - if: inputs.update_base_run != '' && hashFiles('build/ipa/madeira-update.zip') != ''
        uses: actions/upload-artifact@v4
        with: { name: madeira-update, path: build/ipa/madeira-update.zip }
